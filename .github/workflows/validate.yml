name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: codex
          python-version: "3.12"
          channels: conda-forge
          conda-remove-defaults: "true"
          auto-update-conda: false
      - name: Install locked CI-only test dependencies
        shell: pwsh
        run: conda install -n codex -y --override-channels -c conda-forge charset-normalizer=3.4.8 pyyaml=6.0.3
      - name: Validate repository and Skills
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/validate.ps1
      - name: Test named sync and rollback
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/test-sync.ps1

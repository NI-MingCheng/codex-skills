name: Windows validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    defaults:
      run:
        shell: pwsh
        working-directory: tools/EncodingChecker-master
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build sources/EncodingChecker.sln -c Release
      - name: Test
        run: dotnet test sources/EncodingChecker.sln -c Release --no-build
      - name: Package and verify both executables
        run: ./build-agent.ps1
